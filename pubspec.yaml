name: kaeli_ui
description: "Teclado, formularios, teléfono con código de país, selectores, tutorial, compartir, calificar y número del ícono para las apps Flutter de Kaeli."
version: 0.18.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Nombres de los meses en cada idioma (KaeliMonthYearPicker), sin inicializar nada.
  intl: ">=0.19.0 <1.0.0"
  # Tutorial de primera vez, compartir y calificar (0.7.0). Rangos amplios para que sirvan las versiones que ya
  # usan Wibblo (share_plus 12) y AlojaConmigo (share_plus 13).
  in_app_review: ^2.0.9
  share_plus: ">=11.0.0 <14.0.0"
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Solo para las pruebas en francés y portugués (MaterialApp necesita las traducciones de Material).
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

# 0.10.0: plugin (código nativo) para KaeliBadge, el número del ícono. Android en Java; iPhone con Swift Package
# Manager (ios/kaeli_ui/Package.swift) o CocoaPods (ios/kaeli_ui.podspec).
flutter:
  plugin:
    platforms:
      android:
        package: com.kaeli.kaeli_ui
        pluginClass: KaeliUiPlugin
      ios:
        pluginClass: KaeliUiPlugin
