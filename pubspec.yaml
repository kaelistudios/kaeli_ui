name: kaeli_ui
description: "Teclado, formularios y selectores para las apps Flutter de Kaeli."
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Nombres de los meses en cada idioma (KaeliMonthYearPicker), sin inicializar nada.
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Solo para las pruebas en francés y portugués (MaterialApp necesita las traducciones de Material).
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
